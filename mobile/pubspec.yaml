name: reportas
description: ReportAs 2.0 - Registro de gastos con recibos

publish_to: 'none'

version: 2.1.1+5

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Networking
  dio: ^5.7.0

  # State management
  flutter_riverpod: ^2.6.1

  # Security & Auth
  flutter_secure_storage: ^9.2.2
  local_auth: ^2.3.0

  # Camera & Images
  image_picker: ^1.1.2
  photo_view: ^0.15.0
  image: ^4.3.0

  # Device info
  device_info_plus: ^10.1.2

  # Utils
  intl: ^0.20.3

  # Permissions
  permission_handler: ^11.3.1
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
